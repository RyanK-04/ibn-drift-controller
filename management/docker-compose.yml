networks:
  ibn_mgmt:
    name: ibn_mgmt
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.99.0/24
          gateway: 172.16.99.1

services:
  dhcp-server:
    image: strm/dnsmasq
    container_name: permanent-dhcp
    restart: unless-stopped
    volumes:
      - ./dhcp:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    networks:
      ibn_mgmt:
        ipv4_address: 172.16.99.100

  controller:
    image: python:3.11-slim
    container_name: permanent-controller
    restart: unless-stopped
    working_dir: /opt/controller
    volumes:
      - /project/ibn-drift-controller:/opt/controller
    ports:
      - "8080:8080"
    command: >
      sh -c "pip install flask requests && python3 api.py"
    networks:
      ibn_mgmt:
        ipv4_address: 172.16.99.102

  postgres-server:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      ibn_mgmt:
        ipv4_address: 172.16.99.105

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=172.16.99.105
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_password
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
    networks:
      ibn_mgmt:
        ipv4_address: 172.16.99.106

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=172.16.99.105
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_password
      - ZBX_SERVER_HOST=172.16.99.106
    ports:
      - "8082:8080"
    depends_on:
      - zabbix-server
    networks:
      ibn_mgmt:
        ipv4_address: 172.16.99.107

volumes:
  pgdata:
