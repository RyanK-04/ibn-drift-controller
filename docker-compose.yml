version: "3.8"

networks:
  ibn_net:
    external: true
    name: ibn_net

services:
  postgres-server:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      ibn_net:
        ipv4_address: 172.16.99.105

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=172.16.99.105
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=${ZABBIX_DB_USER}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_STARTREPORTWRITERS=2
      - ZBX_WEBSERVICEURL=http://zabbix-web-service:10053/report
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
      - zabbix-web-service
    networks:
      ibn_net:
        ipv4_address: 172.16.99.106

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=172.16.99.105
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=${ZABBIX_DB_USER}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=172.16.99.106
    ports:
      - "8082:8080"
    depends_on:
      - zabbix-server
    networks:
      ibn_net:
        ipv4_address: 172.16.99.107

  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-7.4-latest
    container_name: zabbix-web-service
    restart: unless-stopped
    environment:
      - ZBX_ALLOWEDIP=172.16.99.106
    networks:
      ibn_net:
        ipv4_address: 172.16.99.108

  autonomous-controller:
    image: python:3.11-alpine
    container_name: autonomous-controller
    restart: unless-stopped
    working_dir: /opt/controller
    environment:
      - SRL_USERNAME=${SRL_USERNAME}
      - SRL_PASSWORD=${SRL_PASSWORD}
      - ALPINE_USERNAME=${ALPINE_USERNAME}
      - ALPINE_PASSWORD=${ALPINE_PASSWORD}
      - INTENT_FILE=/opt/controller/controller/intent.yml
      - DAY0_INVENTORY_FILE=/opt/controller/provisioning/day0_inventory.yml
      - LINUX_INIT_FILE=/opt/controller/provisioning/client-static-init.yml
      - TEMPLATES_DIR=/opt/controller/provisioning
      - MAX_REMEDIATION_ATTEMPTS=3
    volumes:
      - ./:/opt/controller
    networks:
      ibn_net:
        ipv4_address: 172.16.99.102
    depends_on:
      - zabbix-server
    command: >
      sh -c "
      apk add --no-cache gcc musl-dev libffi-dev bind-tools iputils &&
      echo 'Verifying Zabbix server connectivity...' &&
      while ! host 172.16.99.106; do sleep 2; done;
      echo 'Zabbix is reachable. Starting controller environment...' &&
      pip install --no-cache-dir pyyaml requests pygnmi netmiko grpcio grpcio-tools jinja2 &&
      python3 controller/autonomous_engine.py
      "

volumes:
  pgdata: