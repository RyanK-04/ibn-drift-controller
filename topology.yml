name: enterprise-core-lab

mgmt:
  network: ibn_net
  ipv4-subnet: 172.16.99.0/24

topology:

  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10.1
      type: ixr-d2l
      enforce-startup-config: true
      startup-config: configs/__clabNodeName__.cfg

  nodes:

    # ========================================================
    # CORE 1
    # ========================================================

    core-srl-1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.16.99.2


    # ========================================================
    # CORE 2
    # ========================================================

    core-srl-2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.16.99.3


    # ========================================================
    # DISTRIBUTION 1
    # ========================================================

    dist-srl-1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.16.99.4


    # ========================================================
    # DISTRIBUTION 2
    # ========================================================

    dist-srl-2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.16.99.5


    # ========================================================
    # TRANSACTION TERMINAL
    # ========================================================

    transaction-terminal:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.16.99.6
      binds:
        - provisioning/client-static-init.yml:/tmp/init.yml:ro
        - provisioning/alpine-init.sh:/tmp/alpine-init.sh:ro
      exec:
        - sh /tmp/alpine-init.sh transaction-terminal


    # ========================================================
    # DESKTOP WORKSTATION
    # ========================================================

    desktop-workstation:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.16.99.7
      binds:
        - provisioning/client-static-init.yml:/tmp/init.yml:ro
        - provisioning/alpine-init.sh:/tmp/alpine-init.sh:ro
      exec:
        - sh /tmp/alpine-init.sh desktop-workstation


    # ========================================================
    # APPLICATION SERVER
    # ========================================================

    application-server:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.16.99.8
      binds:
        - provisioning/client-static-init.yml:/tmp/init.yml:ro
        - provisioning/alpine-init.sh:/tmp/alpine-init.sh:ro
      exec:
        - sh /tmp/alpine-init.sh application-server


  # ==========================================================
  # LINKS
  # ==========================================================

  links:

    # Core-to-core
    - endpoints: ["core-srl-1:e1-1", "core-srl-2:e1-1"]

    # Core 1 to distribution
    - endpoints: ["core-srl-1:e1-2", "dist-srl-1:e1-1"]
    - endpoints: ["core-srl-1:e1-3", "dist-srl-2:e1-1"]

    # Core 2 to distribution
    - endpoints: ["core-srl-2:e1-2", "dist-srl-1:e1-2"]
    - endpoints: ["core-srl-2:e1-3", "dist-srl-2:e1-2"]

    # Distribution interconnect
    - endpoints: ["dist-srl-1:e1-3", "dist-srl-2:e1-3"]

    # Transaction terminal
    - endpoints: ["transaction-terminal:eth1", "dist-srl-1:e1-4"]

    # Desktop workstation
    - endpoints: ["desktop-workstation:eth1", "dist-srl-1:e1-5"]

    # Application server
    - endpoints: ["application-server:eth1", "dist-srl-2:e1-4"]