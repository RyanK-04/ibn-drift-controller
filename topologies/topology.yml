name: banking-core-lab

mgmt:
  network: ibn_mgmt
  ipv4-subnet: 172.16.99.0/24

topology:
  nodes:
    # --- Core Layer ---
    core-srl-1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l

    core-srl-2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l

    # --- Distribution Layer ---
    dist-srl-1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l

    dist-srl-2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l

    # --- Access Layer Clients ---
    client-atm:
      kind: linux
      image: alpine:latest

    client-desktop:
      kind: linux
      image: alpine:latest

    server-app:
      kind: linux
      image: alpine:latest

  links:
    # Core to Distribution Links (Redundant Fabric)
    - endpoints: ["core-srl-1:e1-1", "dist-srl-1:e1-1"]
    - endpoints: ["core-srl-1:e1-2", "dist-srl-2:e1-1"]
    - endpoints: ["core-srl-2:e1-1", "dist-srl-1:e1-2"]
    - endpoints: ["core-srl-2:e1-2", "dist-srl-2:e1-2"]

    # Inter-Distribution Peer Link
    - endpoints: ["dist-srl-1:e1-3", "dist-srl-2:e1-3"]

    # Access Layer to Distribution Links
    - endpoints: ["client-atm:eth1", "dist-srl-1:e1-4"]
    - endpoints: ["client-desktop:eth1", "dist-srl-1:e1-5"]
    - endpoints: ["server-app:eth1", "dist-srl-2:e1-4"]
