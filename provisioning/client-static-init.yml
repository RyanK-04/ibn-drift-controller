# Each host is tagged into its own VLAN over eth1 (802.1Q sub-interface
# eth1.<vlan_id>, created by alpine-init.sh). ip/gw below are for that
# VLAN sub-interface, not the raw eth1 parent link.

transaction-terminal:
  role: "atm"
  vlan_id: 10
  ip: "10.10.10.10/24"
  gw: "10.10.10.1"

desktop-workstation:
  role: "client"
  vlan_id: 30
  ip: "10.10.30.10/24"
  gw: "10.10.30.1"

application-server:
  role: "mobile-banking-server"
  vlan_id: 20
  ip: "10.10.20.10/24"
  gw: "10.10.20.1"