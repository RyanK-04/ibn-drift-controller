network_domain: "enterprise-core"

global_settings:

  routing:
    protocol: "ospfv2"
    area: "0.0.0.0"

  telemetry:
    grpc_target: "172.16.99.106"
    port: 10051

  security:
    acl_name: "ENTERPRISE-SECURITY-ACL"

    drop_tcp_ports:
      - 23

    authorized_users:
      - admin

  system_banner: "AUTHORIZED ENTERPRISE ACCESS ONLY"

  linux_services:
    expected_dns: "8.8.8.8"


devices:

  - name: "core-srl-1"
    management_ip: "172.16.99.2"

  - name: "core-srl-2"
    management_ip: "172.16.99.3"

  - name: "dist-srl-1"
    management_ip: "172.16.99.4"
    vrrp_priority: 150

  - name: "dist-srl-2"
    management_ip: "172.16.99.5"
    vrrp_priority: 100

  - name: "transaction-terminal"
    management_ip: "172.16.99.6"

  - name: "desktop-workstation"
    management_ip: "172.16.99.7"

  - name: "application-server"
    management_ip: "172.16.99.8"